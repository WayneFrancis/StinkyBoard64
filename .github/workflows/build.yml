name: Build
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/StinkyBoard64/StinkyBoard64.csproj
      - run: dotnet build src/StinkyBoard64/StinkyBoard64.csproj --configuration Release --no-restore
